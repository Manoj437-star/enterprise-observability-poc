apiVersion: monitoring.coreos.com/v1
groups:
  - name: enterprise-observability-alerts
    rules:
      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 2m
        labels:
          severity: critical
          tier: infrastructure
        annotations:
          summary: "Kubernetes Node {{ $labels.node }} is NotReady"
          description: "Node {{ $labels.node }} condition Ready has been false for more than 2 minutes."
          runbook_url: "documentation/runbook.md#node-not-ready"

      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          tier: infrastructure
        annotations:
          summary: "Host High CPU utilization on {{ $labels.instance }}"
          description: "CPU usage on {{ $labels.instance }} has exceeded 80% (current: {{ $value }}%)."
          runbook_url: "documentation/runbook.md#high-cpu"

      - alert: HostHighMemoryLoad
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          tier: infrastructure
        annotations:
          summary: "Host High Memory load on {{ $labels.instance }}"
          description: "Memory utilization is above 85% (current: {{ $value }}%)."
          runbook_url: "documentation/runbook.md#high-memory"

      - alert: KubernetesPodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          tier: workloads
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
          description: "Container {{ $labels.container }} restarted {{ $value }} times within the last 5 minutes."
          runbook_url: "documentation/runbook.md#pod-crashloop"

      - alert: KubernetesPodNotReady
        expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed"}) > 0
        for: 5m
        labels:
          severity: warning
          tier: workloads
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
          description: "Pod is in state Pending or Failed for over 5 minutes."
          runbook_url: "documentation/runbook.md#pod-not-ready"

      - alert: SampleAppDown
        expr: up{job="sample-app"} == 0
        for: 1m
        labels:
          severity: critical
          tier: application
        annotations:
          summary: "Sample Application is DOWN"
          description: "Prometheus cannot scrape sample-app endpoints for over 1 minute."
          runbook_url: "documentation/runbook.md#app-down"

      - alert: SampleAppHighErrorRate
        expr: (sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
          tier: application
        annotations:
          summary: "Sample App HTTP 5xx error rate > 5%"
          description: "Service HTTP 5xx error rate is currently at {{ $value }}%."
          runbook_url: "documentation/runbook.md#high-error-rate"

      - alert: SampleAppHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 3m
        labels:
          severity: warning
          tier: application
        annotations:
          summary: "Sample App P95 latency is > 500ms"
          description: "95th percentile request latency is {{ $value }}s."
          runbook_url: "documentation/runbook.md#high-latency"

      - alert: DiskSpaceFillingUp
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 5m
        labels:
          severity: warning
          tier: storage
        annotations:
          summary: "Disk space utilization > 85%"
          description: "Root filesystem usage has exceeded 85%."
          runbook_url: "documentation/runbook.md#disk-space"
